services:
  mariadb:
    image: mariadb:10.6.18
    container_name: dsh-java-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DSH_DB_ROOT_PASSWORD:-dsh-local-root}
      MARIADB_DATABASE: dsh
      MARIADB_USER: dsh
      MARIADB_PASSWORD: ${DSH_DB_PASSWORD:-dsh-local-password}
      TZ: Asia/Shanghai
    ports:
      - "${DSH_DB_PORT:-3307}:3306"
    volumes:
      - ../venus/mariadb/dsh-java/data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
