spring:
  application:
    name: dsh-java

server:
  port: ${SERVER_PORT:8080}

dsh:
  model:
    provider: ${DEEPSEEK_PROVIDER:deepseek}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    name: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    proxy-host: ${DEEPSEEK_PROXY_HOST:}
    proxy-port: ${DEEPSEEK_PROXY_PORT:0}
  persistence:
    enabled: ${DSH_PERSISTENCE_ENABLED:false}
    jdbc-url: ${DSH_DB_URL:jdbc:mariadb://127.0.0.1:3307/dsh}
    username: ${DSH_DB_USER:dsh}
    password: ${DSH_DB_PASSWORD:dsh-local-password}
    max-history-messages: ${DSH_MAX_HISTORY_MESSAGES:24}
    max-context-tokens: ${DSH_MAX_CONTEXT_TOKENS:12000}
  security:
    secret-key: ${DSH_SECRET_KEY:}
  agent:
    max-turns: ${DSH_AGENT_MAX_TURNS:8}
  skills:
    directory: ${DSH_SKILLS_DIR:skills}
  plugins:
    directory: ${DSH_PLUGINS_DIR:plugins}
  mcp:
    reconnect:
      initial-delay-ms: ${DSH_MCP_RECONNECT_INITIAL_DELAY_MS:1000}
      max-delay-ms: ${DSH_MCP_RECONNECT_MAX_DELAY_MS:60000}
      max-attempts: ${DSH_MCP_RECONNECT_MAX_ATTEMPTS:8}
